# Builds the Android TV / Fire TV app in tv-apps/android (a WebView that opens your server) and attaches the APK to
# the run. Only when asked: Actions → Android TV app → Run workflow. Nothing else in the project depends on it.
name: Android TV app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # (Signed with the runner's debug key: fine for putting on your own TV, different on every run.)
      - name: Build
        run: gradle --no-daemon -p tv-apps/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-tv
          path: tv-apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
