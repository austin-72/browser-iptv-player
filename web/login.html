<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d12">
<title>Sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8eaf0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  form { width: 100%; max-width: 360px; background: #151821; border: 1px solid #262b38; border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
  p { margin: 0 0 20px; color: #9aa3b5; font-size: 14px; }
  label { display: block; font-size: 13px; color: #9aa3b5; margin-bottom: 6px; }
  .pw { position: relative; }
  input { width: 100%; font: inherit; color: inherit; background: #0f1117; border: 1px solid #2c3242; border-radius: 10px; padding: 12px 44px 12px 14px; outline: none; }
  input:focus { border-color: #8ab4ff; box-shadow: 0 0 0 3px rgba(138,180,255,.25); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: #9aa3b5; padding: 8px; cursor: pointer; border-radius: 8px; }
  .eye:focus-visible { outline: 2px solid #8ab4ff; }
  button[type=submit] { margin-top: 18px; width: 100%; font: inherit; font-weight: 600; color: #0b0d12; background: #e8eaf0; border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
  button[type=submit]:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: progress; }
  .err { min-height: 20px; margin-top: 12px; color: #ff8a8a; font-size: 14px; }
  .alt { margin-top: 6px; width: 100%; font: inherit; font-size: 14px; color: inherit; background: none; border: 1px solid #2c3242; border-radius: 10px; padding: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .alt:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
  #pair { width: 100%; max-width: 420px; background: #151821; border: 1px solid #262b38; border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #pair .code { font: 700 44px/1.1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .08em; margin: 14px 0 6px; }
  #pair .qr { display: inline-block; background: #fff; padding: 10px; border-radius: 12px; margin: 10px 0 4px; }
  #pair .qr svg { display: block; width: 200px; height: 200px; }
  #pair ol { text-align: left; color: #9aa3b5; font-size: 14px; padding-left: 20px; margin: 14px 0; }
  #pair .link { color: #8ab4ff; word-break: break-all; }
  #pair .wait { color: #9aa3b5; font-size: 13px; }
  .hide { display: none !important; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; }
    html, body { background: #f2f3f7; color: #15171c; }
    form { background: #fff; border-color: #dfe2ea; box-shadow: 0 20px 60px rgba(20,25,40,.08); }
    input { background: #f7f8fb; border-color: #d4d8e2; }
    p, label, .eye { color: #5b6476; }
    button[type=submit] { background: #15171c; color: #fff; }
    #pair { background: #fff; border-color: #dfe2ea; }
    .alt { border-color: #d4d8e2; }
    .err { color: #c62828; }
    #pair ol, #pair .wait { color: #5b6476; }
    #pair .link { color: #1a5fd0; }
  }
  /* A TV is read from across the room: everything bigger. */
  html.tv body { zoom: 1.45; }
  @media (max-height: 760px) { html.tv body { zoom: 1.1; } }
</style>
</head>
<body>
<main style="display:contents">
<form id="f" autocomplete="on">
  <h1>Sign in</h1>
  <p>Enter the password for this server.</p>
  <label for="pw">Password</label>
  <div class="pw">
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="eye" type="button" id="eye" aria-label="Show password" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <button type="submit" id="go">Sign in</button>
  <div class="err" id="err" role="alert" aria-live="assertive"></div>
  <button type="button" class="alt" id="usephone"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg> Sign in with your phone instead</button>
</form>
<section id="pair" class="hide" aria-live="polite">
  <h1>Sign in with your phone</h1>
  <div class="code" id="code">···-···</div>
  <div class="qr" id="qr" aria-hidden="true"></div>
  <ol>
    <li>On a phone that's already signed in, scan the code above — or open <span class="link" id="plink"></span></li>
    <li>Or in the app on your phone: <b>Settings → Sign in a TV</b>, and type the code.</li>
  </ol>
  <div class="wait" id="pwait">Waiting for your phone…</div>
  <button type="button" class="alt" id="usepw">Use the password instead</button>
</section>
</main>
<script>
// Older TV browsers (before Chrome 42) have no fetch(): a small stand-in, enough for this page.
if (!window.fetch && window.Promise) window.fetch = function (url, o) {
  o = o || {};
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open(o.method || 'GET', url, true);
    var h = o.headers || {};
    for (var k in h) if (Object.prototype.hasOwnProperty.call(h, k)) x.setRequestHeader(k, h[k]);
    x.withCredentials = true;
    x.onload = function () { var t = x.responseText; resolve({ ok: x.status >= 200 && x.status < 300, status: x.status, json: function () { return Promise.resolve(t ? JSON.parse(t) : null); } }); };
    x.onerror = function () { reject(new TypeError('Failed to fetch')); };
    x.send(o.body || null);
  });
};
(function () {
  var f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err'), eye = document.getElementById('eye');
  eye.onclick = function () { var show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; eye.setAttribute('aria-pressed', show); eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); pw.focus(); };
  f.onsubmit = function (e) {
    e.preventDefault();
    go.disabled = true; err.textContent = '';
    fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-App': '1' }, body: JSON.stringify({ password: pw.value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || (r.status >= 500 ? 'The server isn’t answering properly right now (' + r.status + '). Try again in a moment.' : 'Sign-in failed')); location.replace('/' + location.hash); }); })
      .catch(function (x) { err.textContent = x instanceof TypeError ? 'Can’t reach the server.' : x.message; go.disabled = false; pw.select(); });
  };

  // Sign in with a phone: show a code (and QR code); a signed-in phone approves it.
  var pair = document.getElementById('pair'), timer = null, cur = null;
  function start() {
    var prev = (cur && cur.id) || '';
    try { prev = prev || sessionStorage.getItem('pairId') || ''; } catch (e) {}
    fetch('/api/pair/start', { method: 'POST', headers: { 'X-App': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ prev: prev }) }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Couldn’t get a code.'); return j; }); }).then(function (j) {
      cur = j;
      try { sessionStorage.setItem('pairId', j.id); } catch (e) {}
      document.getElementById('code').textContent = j.code;
      document.getElementById('qr').innerHTML = j.qr;
      document.getElementById('plink').textContent = j.link.replace(/^https?:\/\//, '');
      document.getElementById('pwait').textContent = 'Waiting for your phone…';
      clearInterval(timer);
      timer = setInterval(poll, 2000);
      setTimeout(function () { if (cur === j) start(); }, Math.max(60000, j.expires - Date.now() - 15000));
    }).catch(function (e) {
      // Couldn't get a code (offline, or too many asked for): say so and try again in a little while.
      cur = null; clearInterval(timer);
      document.getElementById('pwait').textContent = (e instanceof TypeError || !e || !e.message ? 'Can’t reach the server.' : e.message) + ' Trying again shortly…';
      clearTimeout(start._retry);
      start._retry = setTimeout(function () { if (!pair.classList.contains('hide') && !cur) start(); }, 20000);
    });
  }
  function poll() {
    if (!cur) return;
    fetch('/api/pair/' + cur.id + '?s=' + encodeURIComponent(cur.secret), { headers: { 'X-App': '1' } }).then(function (r) {
      if (r.status === 404 || r.status === 410) { start(); return; }
      return r.json().then(function (j) { if (j.ok) { clearInterval(timer); document.getElementById('pwait').textContent = 'Signed in!'; location.replace('/'); } });
    }).catch(function () {});
  }
  function show(phone) {
    f.classList.toggle('hide', phone); pair.classList.toggle('hide', !phone);
    if (phone) { start(); document.getElementById('usepw').focus(); } else { clearInterval(timer); cur = null; pw.focus(); }
  }
  document.getElementById('usephone').onclick = function () { show(true); };
  document.getElementById('usepw').onclick = function () { show(false); };
  // TVs: typing a password with a remote is no fun — start with the code.
  if (/SMART-TV|SmartTV|Tizen|Web0S|webOS|BRAVIA|AFT|CrKey|GoogleTV|Android TV|HbbTV|NetCast|Viera|AQUOS|PhilipsTV/i.test(navigator.userAgent)) { document.documentElement.className += ' tv'; show(true); }
})();
</script>
</body>
</html>
