<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Avatar contact sheet</title>
<style>
  body { margin: 0; padding: 24px; background: #141414; color: #e5e5e5; font: 13px/1.3 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 28px 0 12px; color: #fff; }
  h2 small { color: #888; font-weight: normal; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .cell { width: 110px; text-align: center; }
  .av { width: 96px; height: 96px; border-radius: 10px; overflow: hidden; margin: 0 auto 6px; }
  .av svg { width: 100%; height: 100%; display: block; }
  .idx { color: #888; }
  .small { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .small .av { width: 48px; height: 48px; border-radius: 6px; margin: 0; }
  #err { color: #ff6b6b; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Avatars <span id="meta"></span></h1>
<div id="err"></div>
<div id="out"></div>
<h2>All at 48px</h2>
<div class="small" id="small"></div>
<script src="../web/js/avatars.js"></script>
<script>
  (function () {
    var A = window.AVATARS, out = document.getElementById('out'), errs = [];
    document.getElementById('meta').textContent = '(' + A.count + ')';
    var parser = new DOMParser();
    A.categories.forEach(function (cat) {
      var h = document.createElement('h2');
      h.innerHTML = cat.name + ' <small>' + cat.from + '&ndash;' + cat.to + '</small>';
      out.appendChild(h);
      var g = document.createElement('div');
      g.className = 'grid';
      for (var i = cat.from; i <= cat.to; i++) {
        var s = A.svg(i);
        var doc = parser.parseFromString(s, 'image/svg+xml');
        if (doc.getElementsByTagName('parsererror').length) errs.push('#' + i + ' invalid XML');
        if (A.category(i) !== cat.name) errs.push('#' + i + ' category mismatch');
        var c = document.createElement('div');
        c.className = 'cell';
        c.innerHTML = '<div class="av">' + s + '</div><span class="idx">' + i + '</span> ' + A.name(i);
        g.appendChild(c);
      }
      out.appendChild(g);
    });
    var sm = document.getElementById('small');
    for (var i = 0; i < A.count; i++) {
      var d = document.createElement('div');
      d.className = 'av';
      d.innerHTML = A.svg(i);
      sm.appendChild(d);
    }
    document.getElementById('err').textContent = errs.join('\n');
    window.__avatarErrors = errs;
  })();
</script>
</body>
</html>
